# Omakid theme: orange
# NOTE: the Omarchy manual recommends copying an existing theme from
# ~/.local/share/omarchy/themes/ as a base, then tweaking colors.toml.
# This is a minimal palette stub — verify key names against the installed
# themes on first build, since colors.toml drives generated configs for
# the terminal, btop, Chromium, Hyprland, Hyprlock, Mako, SwayOSD and the shell.

[colors]
primary    = "#e07a3f"
background = "#3d1d0a"
foreground = "#fdefe4"
accent     = "#e07a3f"
highlight  = "#f2b184"

# Kid-facing surfaces read these two.
[omakid]
grid_background = "#3d1d0a"
tile_highlight  = "#f2b184"
